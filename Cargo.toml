[package]
name = "bevy-visualgo"
version = "0.1.0"
edition = "2024"

[features]
default = []
dev = ["bevy/dynamic_linking"]

[dependencies.bevy]
version = "0.17.1"
default-features = false
features = [
  # Default features
  "std",
  "async_executor",
  "animation",
  "bevy_asset",
  # "bevy_audio",
  "bevy_color",
  "bevy_core_pipeline",
  "bevy_post_process",
  "bevy_anti_alias",
  # "bevy_gilrs",
  # "bevy_gizmos",
  # "bevy_gltf",
  "bevy_input_focus",
  "bevy_log",
  # "bevy_mesh_picking_backend",
  "bevy_pbr",
  "bevy_picking",
  "bevy_render",
  "bevy_scene",
  "bevy_image",
  # "bevy_mesh",
  "bevy_camera",
  "bevy_light",
  # "bevy_shader",
  "bevy_sprite",
  # "bevy_sprite_picking_backend",
  # "bevy_sprite_render",
  "bevy_state",
  "bevy_text",
  "bevy_ui",
  "bevy_ui_picking_backend",
  "bevy_ui_render",
  "bevy_window",
  "bevy_winit",
  "custom_cursor",
  "default_font",
  # "hdr",
  "ktx2",
  "multi_threaded",
  "png",
  "reflect_auto_register",
  # "smaa_luts",
  "sysinfo_plugin",
  # "tonemapping_luts",
  "vorbis",
  "webgl2",
  "x11",
  "wayland",
  "debug",
  "zstd_rust",

  # Extras
  "bevy_ui_debug",
  "libm",
]

[dependencies]
getrandom = { version = "*", features = ["wasm_js"] }

log = { version = "*", features = [
  "max_level_debug",
  "release_max_level_warn",
] }

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1
codegen-backend = "cranelift"

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
codegen-backend = "llvm"

[profile.release]
codegen-units = 1
lto = "thin"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"
